<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set Automation Password</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17191c}
.card{width:min(420px,calc(100% - 32px));box-sizing:border-box;background:#fff;border:1px solid #ddd;border-radius:14px;padding:28px;box-shadow:0 8px 30px #00000012}
h1{font-size:22px;margin:0 0 8px}p{color:#666;line-height:1.45}label{display:block;font-size:14px;font-weight:600;margin:18px 0 7px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:9px;font-size:16px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#17191c;color:#fff;font-size:16px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{margin-top:16px;font-size:14px}.ok{color:#176b3a}.err{color:#a51d2d}.secondary{background:#fff;color:#17191c;border:1px solid #bbb}
</style>
</head>
<body>
<main class="card">
<h1>Set your Automation password</h1>
<p id="intro">Sign in with the Google account already connected to this Automation account, then choose a password for ChatGPT.</p>
<button id="google" class="secondary" type="button">Continue with Google</button>
<form id="form" style="display:none">
<label for="password">New password</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">Confirm password</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button id="submit" type="submit">Set password</button>
</form>
<div id="msg" class="msg"></div>
</main>
<script>
const msg=document.getElementById('msg'),form=document.getElementById('form'),button=document.getElementById('submit'),google=document.getElementById('google'),intro=document.getElementById('intro');
const hash=new URLSearchParams(location.hash.replace(/^#/,''));
const accessToken=hash.get('access_token');
const type=hash.get('type');
const setMessage=(text,kind)=>{msg.textContent=text;msg.className='msg '+(kind||'')};
async function config(){const r=await fetch('/api/realtime-config',{cache:'no-store'});if(!r.ok)throw new Error('Authentication configuration unavailable');return r.json()}
google.addEventListener('click',async()=>{google.disabled=true;setMessage('Opening Google sign-in…');try{const c=await config();const redirect=location.origin+location.pathname;location.href=c.url+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(redirect)}catch(error){google.disabled=false;setMessage(error.message||'Google sign-in failed.','err')}});
if(accessToken){form.style.display='block';google.style.display='none';intro.textContent='You are signed in. Choose a password for the YouTube Automation ChatGPT connection.'}
if(type==='recovery'&&!accessToken){form.style.display='none';google.style.display='none';setMessage('This password-reset link is missing or has expired.','err')}
form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password.length<8)return setMessage('Password must be at least 8 characters.','err');if(password!==confirm)return setMessage('Passwords do not match.','err');button.disabled=true;setMessage('Updating password…');try{const c=await config();const response=await fetch(c.url+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json',apikey:c.anon_key,Authorization:'Bearer '+accessToken},body:JSON.stringify({password})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data?.msg||data?.message||'Password update failed');history.replaceState(null,document.title,location.pathname);form.style.display='none';setMessage('Password updated successfully. You can now return to ChatGPT and sign in with your Supabase email and this password.','ok')}catch(error){button.disabled=false;setMessage(error.message||'Password update failed.','err')}});
</script>
</body>
</html>
